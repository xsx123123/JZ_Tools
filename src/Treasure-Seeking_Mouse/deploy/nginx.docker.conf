# GEO寻宝鼠 · 容器内 nginx 配置（web 服务）
# 静态托管前端产物 + /chat-api 同源反代到 chat 服务（docker-compose 内网名 chat:8787）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源长缓存（文件名带 hash，内容变即换名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退（/about 等前端路径都落到 index.html）
    # index.html 必须每次都校验更新：它指向带 hash 的 JS/CSS，缓存它会让用户长期拿不到新版
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 对话服务反代（SSE 流式必需的两项：关缓冲、拉长读超时）
    # 前端 chatEndpoint 是无尾斜杠的 /chat-api，必须显式精确匹配：
    # 否则落到 location / 的 try_files 会 301 到 http://<host>/chat-api/（丢端口），浏览器跟到 80 端口直接挂
    location = /chat-api {
        proxy_pass http://chat:8787/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /chat-api/ {
        proxy_pass http://chat:8787/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
