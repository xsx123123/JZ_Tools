# GEO寻宝鼠 · 云服务器宿主机 Nginx 配置（cygnusx.icu）
#
# 用途：TLS 终结在宿主机，反代到本机服务
#   /            → Web 版前端（docker compose 的 web 容器，映射 127.0.0.1:10087，随 WEB_PORT 调整）
#   /chat-api    → chat 服务（server/local.mjs，监听 127.0.0.1:8787）
#
# 启用方式（Ubuntu/Debian 示例）：
#   1) 先签证书：sudo certbot --nginx -d cygnusx.icu（或把云厂商证书放到下方 ssl 路径）
#   2) sudo cp deploy/nginx.host.conf /etc/nginx/sites-available/geo-muse
#   3) sudo ln -s /etc/nginx/sites-available/geo-muse /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ compose 拓扑注意：web 容器的端口映射必须是 "127.0.0.1:10087:80"（绑回环，端口随 WEB_PORT 调整），
#    chat 容器不映射宿主机端口（compose 里已只 expose），否则绕过本配置的限流与缓冲控制。

# 对话接口限流：每 IP 每分钟 10 次，突发 5 个不延迟（SSE 长连接期间不计新请求）
limit_req_zone $binary_remote_addr zone=chatapi:10m rate=10r/m;

server {
    listen 80;
    server_name cygnusx.icu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cygnusx.icu;

    ssl_certificate     /etc/letsencrypt/live/cygnusx.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cygnusx.icu/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Web 版前端（不需要 Web 入口可整段删除，小程序只用 /chat-api）
    location / {
        proxy_pass http://127.0.0.1:10087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 对话服务反代：SSE 流式三要素——关缓冲、HTTP/1.1、拉长读超时
    # 精确匹配无尾斜杠 /chat-api（与小程序 chatEndpoint 一致），避免落到 location / 的 SPA 回退
    location = /chat-api {
        limit_req zone=chatapi burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 子路径（/chat-api/stats 等）：proxy_pass 带尾斜杠剥掉 /chat-api/ 前缀
    location /chat-api/ {
        limit_req zone=chatapi burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
