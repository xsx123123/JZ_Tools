[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kegg-pull"
version = "0.1.0"
description = "Offline KEGG organism annotation downloader and GMT builder"
readme = "docs/KEGG_离线注释数据库下载指南.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "PyYAML>=6",
    "rich>=13",
    "rich-argparse>=1.4",
]

[project.scripts]
kegg-pull = "kegg_pull.cli:main"
download-kegg-annotations = "kegg_pull.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kegg_pull*"]

[tool.setuptools.package-data]
kegg_pull = ["config/*.yaml"]
