[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqout-mcp"
version = "0.2.0"
description = "MCP server for searching public omics datasets through seqout.org"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastmcp>=3.1,<3.2", "httpx>=0.27"]

[project.urls]
Homepage = "https://seqout.org"
Repository = "https://github.com/xsx123123/JZ_Tools/tree/main/src/seqout-mcp"
Issues = "https://github.com/xsx123123/JZ_Tools/issues"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
seqout-mcp = "seqout_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
